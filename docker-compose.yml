services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - placement_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  runner:
    build:
      context: ./runner

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 64

    mem_limit: 256m

    expose:
      - "8090"

  app:
    build: .

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

      runner:
        condition: service_started

    environment:
      DATABASE_URL: ${DATABASE_URL}

      APP_STORAGE_SECRET: ${APP_STORAGE_SECRET}
      STAFF_SIGNUP_CODE: ${STAFF_SIGNUP_CODE}

      SERPAPI_API_KEY: ${SERPAPI_API_KEY}

      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}

      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://runner:8090}

      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
      
      AWS_REGION: ${AWS_REGION}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      BEDROCK_VALIDATOR_MODEL_ID: ${BEDROCK_VALIDATOR_MODEL_ID}
      BEDROCK_MAX_TOKENS: ${BEDROCK_MAX_TOKENS}
      BEDROCK_VALIDATOR_MAX_TOKENS: ${BEDROCK_VALIDATOR_MAX_TOKENS}

    ports:
      - "${PORT:-8080}:${PORT:-8080}"

    volumes:
      - ~/.aws:/root/.aws:ro

volumes:
  placement_postgres_data: